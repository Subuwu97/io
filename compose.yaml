services:
  io:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5921:5921"
    environment:
      NODE_ENV: production
      IO_DATA_DIR: /var/lib/io
      PORT: "5921"
    volumes:
      - io-data:/var/lib/io
      - ${IO_ANIME_PATH:?Set IO_ANIME_PATH}:/media/anime:ro
      - ${IO_MOVIES_PATH:?Set IO_MOVIES_PATH}:/media/movies:ro
      - ${IO_MANGA_PATH:?Set IO_MANGA_PATH}:/media/manga:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  io-data:
