plugins { id 'com.android.application' }
android {
 namespace 'app.io.tv'
 compileSdkVersion 'android-36.1'
 defaultConfig { applicationId 'app.io.tv'; minSdk 23; targetSdk 35; versionCode 1; versionName '0.1.0-preview' }
 signingConfigs { debug { storeFile file(System.getenv('IO_ANDROID_DEBUG_KEYSTORE') ?: System.getProperty('user.home')+'/.android/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.media3:media3-exoplayer:1.11.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
 implementation 'androidx.media3:media3-ui:1.11.1'
}
